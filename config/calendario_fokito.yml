curso:
  nombre: "Calendario Curso"
  timezone: "America/Santiago"

calendario:
  periodo:
    fecha_inicio: "2026-03-16"
    numero_semanas: 19

  secciones:
    "Sección 1":
      teorica:   { dia_semana: "Monday",    inicio: "12:00", fin: "13:30" }
      seminario: { dia_semana: "Wednesday", inicio: "15:00", fin: "16:30" }
      lab:       { dia_semana: "Wednesday", inicio: "16:45", fin: "18:15" }

    "Sección 2":
      teorica:   { dia_semana: "Monday", inicio: "16:45", fin: "18:15" }
      seminario: { dia_semana: "Friday", inicio: "08:30", fin: "10:00" }
      lab:       { dia_semana: "Monday", inicio: "15:00", fin: "16:30" }

    "Sección 3":
      teorica:   { dia_semana: "Wednesday", inicio: "16:45", fin: "18:15" }
      seminario: { dia_semana: "Friday",    inicio: "10:15", fin: "11:45" }
      lab:       { dia_semana: "Friday",    inicio: "12:00", fin: "13:30" }

    "Sección 4":
      teorica:   { dia_semana: "Wednesday", inicio: "15:00", fin: "16:30" }
      seminario: { dia_semana: "Friday",    inicio: "08:30", fin: "10:00" }
      lab:       { dia_semana: "Friday",    inicio: "10:15", fin: "11:45" }

  laboratorios:
    frecuencia: "cada_2_semanas"
    semanas: "pares"

  profesores_base:
    - { seccion: "Sección 1", actividad: "Clase teórica", profesores: "TY" }
    - { seccion: "Sección 1", actividad: "Seminario",    profesores: "IG" }
    - { seccion: "Sección 1", actividad: "Laboratorio",  profesores: "CC" }

    - { seccion: "Sección 2", actividad: "Clase teórica", profesores: "AR" }
    - { seccion: "Sección 2", actividad: "Seminario",    profesores: "JCS" }
    - { seccion: "Sección 2", actividad: "Laboratorio",  profesores: "IG" }

    - { seccion: "Sección 3", actividad: "Clase teórica", profesores: "CC" }
    - { seccion: "Sección 3", actividad: "Seminario",    profesores: "TY" }
    - { seccion: "Sección 3", actividad: "Laboratorio",  profesores: "AR" }

    - { seccion: "Sección 4", actividad: "Clase teórica", profesores: "IG" }
    - { seccion: "Sección 4", actividad: "Seminario",    profesores: "CC" }
    - { seccion: "Sección 4", actividad: "Laboratorio",  profesores: "JCS" }

  temas_por_semana:
    1: "Lógica 1"
    2: "Lógica 2"
    3: "Lógica 3"
    4: "Repaso (semana mechona)"
    5: "Certamen 1"
    6: "Modelos y Derivadas 1"
    7: "Modelos y Derivadas 2"
    8: "Modelos y Derivadas 3"
    9: "Modelos y Derivadas 4"
    10: "Semana Receso"
    11: "Certamen 2"
    12: "Linealización de modelos"
    13: "Trigonometría y Vectores 1"
    14: "Trigonometría y Vectores 2"
    15: "Trigonometría y Vectores 3"
    16: "Certamen 3"
    17: "Trabajo Autónomo"
    18: "Examen Primera Oportunidad"
    19: "Examen Segunda Oportunidad"

  evaluaciones:
    # Examenes
    - { modo: "por_filtro", seccion: "Sección 1", semana: 18, actividad: "Clase teórica", tipo: "Examen", observaciones: "Examen Primera Oportunidad" }
    - { modo: "por_filtro", seccion: "Sección 2", semana: 18, actividad: "Clase teórica", tipo: "Examen", observaciones: "Examen Primera Oportunidad" }
    - { modo: "por_filtro", seccion: "Sección 3", semana: 18, actividad: "Clase teórica", tipo: "Examen", observaciones: "Examen Primera Oportunidad" }
    - { modo: "por_filtro", seccion: "Sección 4", semana: 18, actividad: "Clase teórica", tipo: "Examen", observaciones: "Examen Primera Oportunidad" }

    - { modo: "por_filtro", seccion: "Sección 1", semana: 19, actividad: "Clase teórica", tipo: "Examen", observaciones: "Examen Segunda Oportunidad" }
    - { modo: "por_filtro", seccion: "Sección 2", semana: 19, actividad: "Clase teórica", tipo: "Examen", observaciones: "Examen Segunda Oportunidad" }
    - { modo: "por_filtro", seccion: "Sección 3", semana: 19, actividad: "Clase teórica", tipo: "Examen", observaciones: "Examen Segunda Oportunidad" }
    - { modo: "por_filtro", seccion: "Sección 4", semana: 19, actividad: "Clase teórica", tipo: "Examen", observaciones: "Examen Segunda Oportunidad" }

    # Trabajo Práctico
    - { modo: "por_filtro", seccion: "Sección 2", semana: 6, actividad: "Seminario", tipo: "Trabajo práctico", observaciones: "Entrega al final" }

  pausas_academicas:
    - { inicio: "2026-05-18", fin: "2026-05-24", etiqueta: "Semana de Pausa Académica" }

  semanas_trabajo_autonomo:
    - 17

  bloques:
    definicion:
      "3": { inicio: "12:00", fin: "13:30" }
      "4": { inicio: "15:00", fin: "16:30" }
    protegidos:
      - { fecha: "2026-04-01", bloque: "3" }
      - { fecha: "2026-05-04", bloque: "4" }
      - { fecha: "2026-06-11", bloque: "3" }
      - { fecha: "2026-06-23", bloque: "4" }

  feriados:
    usar_automaticos_chile: true
    manuales: []

# ============================================================
# Misiones / Protocolos (antes misiones_config.yml)
# ============================================================
misiones:
  aleatoriedad:
    semilla: 42

  # Secciones para matriz (puedes dejar todas o solo algunas)
  secciones:
    - "Sección 1"
    - "Sección 2"
    - "Sección 3"
    - "Sección 4"

  profesores:
    - { codigo: "p1", horas_contrato: 10 }
    - { codigo: "p2", horas_contrato: 10 }
    - { codigo: "p3", horas_contrato: 10 }
    - { codigo: "p4", horas_contrato: 10 }

  alias_seccion:
    "Sección 1": "Sección 1"
    "Sección 2": "Sección 2"
    "Sección 3": "Sección 3"
    "Sección 4": "Sección 4"

  # Protocolos por tipo de evaluación (mapea por "evaluación" del calendario)
  # OJO: tu generador debe mapear Prueba/Certamen/Control a este protocolo (lo ajustas en Python)
  protocolos:
    Prueba:
      pedir_preguntas:
        responsables: "Todos"
        detalle: "Recolección de preguntas."
        offset_dias: -14
      construir_control:
        responsables: "Asignar"
        detalle: "Armado y diagramación."
        offset_dias: -7
      pauta_prueba:
        responsables: "Asignar"
        detalle: "Pauta oficial."
        offset_dias: -5
      revisar_prueba:
        responsables: "Asignar"
        detalle: "Revisión final."
        offset_dias: -3
      escanear:
        responsables: "Asignar"
        detalle: "Escaneo y subida."
        offset_dias: +2
      corregir_y_notas:
        responsables: "Asignar"
        detalle: "Corrección y notas."
        offset_dias: +14

    TP:
      revisar_tp:
        responsables: "Todos"
        detalle: "Revisar TP y poner nota."
        offset_dias: +14

    Examen:
      pedir_preguntas:
        responsables: "Todos"
        detalle: "Preguntas examen."
        offset_dias: -21
      construir_examen:
        responsables: "Asignar"
        detalle: "Construcción examen."
        offset_dias: -14
      pauta_examen:
        responsables: "Asignar"
        detalle: "Pauta examen."
        offset_dias: -7
      corregir_examen:
        responsables: "Asignar"
        detalle: "Corrección examen."
        offset_dias: +14

# ============================================================
# Salidas por curso (rutas finales de los excels)
# ============================================================
salida:
  calendario_excel_path: "data/calendario.xlsx"
  misiones_excel_path: "data/misiones.xlsx"