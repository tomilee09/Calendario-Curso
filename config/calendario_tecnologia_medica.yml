      ====================
      MISIONES
      ====================

      {lista_misiones}

      ====================
      CLASES DE LA SEMANA
      ====================

      {lista_clases}

      Si no aparece ninguna misión, eso significa que no tienes misiones planificadas originalmente para esta semana.
      De todos modos, puede haber coordinaciones adicionales conversadas con el equipo docente que no estén reflejadas aquí.

      Puedes revisar el calendario completo aquí:
      https://calendario-curso.streamlit.app

